name: CI
on:
  push:
    branches: [ main, ppx-elpi ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout tree
      uses: actions/checkout@v4
    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5.3
        dune-cache: true
    - name: Build
      run: |
        opam install . --deps-only
        opam exec -- dune build
    - name: Test
      run: opam exec -- dune runtest
